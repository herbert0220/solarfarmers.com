<!DOCTYPE html>

    <title>晨世能源 - 金峰嘉蘭計畫 × ESG 永續發展</title>
    <link rel="stylesheet" href="style.css"> <!-- 連結您原本的樣式檔，確保畫面不跑掉 -->

<body>

    <!-- 頂部深綠色導覽列 -->
    <header class="navbar">
        <div class="container navbar-container">
            <div class="logo-area">
                <span class="logo-text">晨世能源 ✕ 源能資本</span>
            </div>
            <nav class="nav-links">
                <a href="index.html">首頁</a>

        </div>
    </header>

    <!-- 核心形象大圖區 -->

        <div class="hero-overlay"></div>

            <h1 class="hero-main-title">金峰嘉蘭地熱專案 ✕ AI儲能ESG ✕ 公益共享</h1>

    <!-- 四大業務板塊區 -->

        <div class="container">
            <div class="features-grid">
                
                <!-- 板塊 1：地熱開發 -->
                <div class="feature-card">
                    <div class="feature-image-wrapper">
                        <img src="photo-geothermal.jpg" alt="地熱開發">

                    <p class="feature-desc">本土企業 ✕ 尊重在地 ✕ 部落共生</p>

                    </a>
                </div>

                <!-- 板塊 2：源能資本 -->
                <div class="feature-card">
                    <div class="feature-image-wrapper">
                        <img src="photo-investment.jpg" alt="源能資本">
                    </div>
                    <h3 class="feature-title">源能資本</h3>
                    <p class="feature-desc">綠色金融 ✕ 精準投資 ✕ 永續鏈結</p>

                    <div class="feature-image-wrapper">
                        <img src="photo-taichung.jpg" alt="台中示範廠">
                    </div>
                    <h3 class="feature-title">台中示範廠</h3>
                    <p class="feature-desc">綠能轉型示範場域 ✕ 智慧儲能系統應用</p>

                <!-- 板塊 4：海外布局 -->

                        <img src="photo-overseas.jpg" alt="海外布局">
                    </div>
                    <h3 class="feature-title">海外布局</h3>
                    <p class="feature-desc">輸出台灣經驗 ✕ 拓展東協光儲市場</p>
                </div>

            </div>
        </div>

    <!-- 頁尾 -->
    <footer class="footer">
        <p>&copy; 2026 晨世能源股份有限公司 & 源能資本. All rights reserved.</p>
