    <link rel="stylesheet" href="style.css">

    <!-- 頂部深綠色導覽列（完全維持原有配色） -->
    <header class="navbar">
        <div class="container navbar-container">
            <div class="logo-area">
                <img src="logo.png" alt="晨世能源" class="logo-img">

            <nav class="nav-links">

                <a href="#about">關於我們</a>
