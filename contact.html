<style>
    /* 延續 LOGO 的部落大地色系 CSS 變數 */
    :root {
        --primary-dark: #3D2515;   /* 深焦糖褐 */
        --earth-red: #A84428;      /* 火山紅 */
        --tribal-gold: #DEAF62;    /* 太陽金黃 */
        --forest-green: #5B6B4E;   /* 祖靈綠 */
        --sand-beige: #F1E5CB;     /* 溫潤沙米 */
        --text-dark: #2B1A0E;
    }

    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "PingFang TC", "Heiti TC", "Microsoft JhengHei", sans-serif;
    }

    body {
        background-color: var(--sand-beige);
        color: var(--text-dark);
        line-height: 1.6;
    }

    /* 導覽列 */
    .navbar {
        background-color: var(--primary-dark);
        padding: 15px 5%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        border-bottom: 4px solid var(--tribal-gold);
    }

    .navbar .logo img {
        height: 45px;
        width: auto;
        border-radius: 50%;
    }

    nav a {
        color: var(--sand-beige);
        text-decoration: none;
        margin-left: 20px;
        font-size: 0.95rem;
        transition: color 0.3s;
        padding: 6px 12px;
    }

    nav a:hover, nav a.active {
        color: var(--tribal-gold);
    }

    nav a.active {
        border-bottom: 2px solid var(--tribal-gold);
    }

    /* 內文區塊 */
    .content {
        max-width: 800px;
        margin: 40px auto;
        padding: 30px;
        background-color: #E6D9BC; /* 微調深沙色底襯托內容 */
        border: 3px solid var(--primary-dark);
        border-radius: 12px;
        box-shadow: 0 6px 0 var(--primary-dark);
    }

    h1 {
        color: var(--earth-red);
        font-size: 2.2rem;
        margin-bottom: 20px;
        border-bottom: 3px solid var(--primary-dark);
        padding-bottom: 10px;
    }

    h2 {
        color: var(--primary-dark);
        font-size: 1.5rem;
        margin: 35px 0 15px 0;
    }

    p {
        font-size: 1.05rem;
        margin-bottom: 12px;
    }

    a {
        color: var(--earth-red);
        text-decoration: none;
        font-weight: bold;
    }

    a:hover {
        text-decoration: underline;
    }

    /* 📸 新增：示範廠照片區塊樣式 */
    .factory-photo-container {
        width: 100%;
        margin: 15px 0 30px 0;
        border: 3px solid var(--primary-dark);
        border-radius: 8px;
        overflow: hidden;
        background-color: var(--sand-beige);
        box-shadow: 0 4px 0 var(--primary-dark);
    }

    .factory-photo-container img {
        width: 100%;
        height: auto;
        display: block;
        object-fit: cover;
    }

    .factory-photo-caption {
        padding: 10px;
        text-align: center;
        background-color: var(--primary-dark);
        color: var(--sand-beige);
        font-size: 0.9rem;
        font-weight: bold;
    }

    /* 地圖區塊 */
    .map-container {
        border: 3px solid var(--primary-dark);
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 0 var(--primary-dark);
    }

    /* 頁尾 */
    footer {
        background-color: var(--primary-dark);
        color: var(--sand-beige);
        text-align: center;
        padding: 20px 0;
        font-size: 0.85rem;
        margin-top: 50px;
        border-top: 4px solid var(--earth-red);
    }
</style>
